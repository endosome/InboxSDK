version: 2.1
orbs:
  node: circleci/node@5.1.0
executors:
  sdk:
    docker:
      - image: cimg/node:24.20.0

jobs:
  'build calendarsdk core':
    executor: sdk
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn-berry
      - run:
          name: Build
          command: yarn gulp
      - run:
          name: Check output files exist (SDK bundle and every example)
          command: |
            ls packages/core/calendarsdk.js
            for d in examples/calendar-*/; do ls "${d}dist/content.js"; done
      - run:
          name: Build @calendarsdk/google-api
          command: |
            yarn workspace @calendarsdk/google-api build
            ls packages/google-api/dist/index.js packages/google-api/dist/index.d.ts
      - run:
          name: Clean
          command: yarn gulp clean
  lint JS and TS:
    executor: sdk
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn-berry
      - run:
          name: ESLint
          command: yarn lint:eslint
      - run:
          name: Prettier
          command: yarn prettier:check
  lint CSS:
    executor: sdk
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn-berry
      - run:
          name: Stylelint
          command: yarn lint:stylelint
  test:
    executor: sdk
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn-berry
      - run:
          # https://stackoverflow.com/questions/71985308/jest-a-worker-process-has-failed-to-exit-gracefully-and-has-been-force-exited#comment130902392_74087365
          command: yarn test --detectOpenHandles
          name: Tests
  typecheck:
    executor: sdk
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn-berry

      - run:
          name: Build
          command: yarn gulp
      - run:
          name: Typecheck (tsc)
          command: yarn tsc

workflows:
  version: 2
  all_workflow:
    jobs:
      - 'build calendarsdk core'
      - lint JS and TS
      - lint CSS
      - test
      - typecheck
